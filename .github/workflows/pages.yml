name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Configure shared basemap keys
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          config = {"esriApiKey": os.environ.get("ESRI_API_KEY", ""), "maptilerApiKey": os.environ.get("MAPTILER_API_KEY", "")}
          Path("map-provider-config.js").write_text("window.FIELD2SIM_MAP_CONFIG = " + json.dumps(config) + ";\n")
          PYCONFIG
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
